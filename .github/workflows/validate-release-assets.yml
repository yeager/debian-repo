name: Validate release asset manifest

on:
  push:
    branches: [main]
    paths:
      - "maintenance/release-assets.json"
      - "scripts/validate-release-assets.py"
      - "scripts/check-pages-size.py"
      - ".github/workflows/validate-release-assets.yml"
  pull_request:
    paths:
      - "maintenance/release-assets.json"
      - "scripts/validate-release-assets.py"
      - "scripts/check-pages-size.py"
      - ".github/workflows/validate-release-assets.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate pinned DEB release assets
        run: python3 scripts/validate-release-assets.py
      - name: Check GitHub Pages artifact size
        run: python3 scripts/check-pages-size.py

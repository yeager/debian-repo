name: Build RPM

on:
  workflow_dispatch:
  push:
    paths:
      - 'pool/main/*.deb'

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm alien
      
      - name: Convert DEBs to RPMs
        run: |
          mkdir -p rpms
          cd pool/main
          for deb in *.deb; do
            echo "Converting $deb to RPM..."
            sudo alien --to-rpm --scripts "$deb"
            mv *.rpm ../../rpms/
          done
      
      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: rpms/*.rpm
